replicaCount: 1

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/session
  tag: 2.11.8
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8070
  extraPorts:
    - port: 6566
      name: grpc
extraContainerPorts:
  - name: grpc
    containerPort: 6566
resources:
  limits:
    cpu: 512m
    memory: 1Gi
  requests:
    cpu: 128m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: "/actuator/health/liveness"
    port: 8070
    host: localhost
    scheme: HTTP
  initialDelaySeconds: 300
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/actuator/health/readiness"
    port: 8070
    host: localhost
    scheme: HTTP
  initialDelaySeconds: 240
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3

extraVolumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "session-spc"
extraVolumeMounts:
  - name: secrets-store-inline
    mountPath: "/mnt/secrets-store"
    readOnly: true

nodeSelector:
  karpenter.sh/nodepool: application-node-pool