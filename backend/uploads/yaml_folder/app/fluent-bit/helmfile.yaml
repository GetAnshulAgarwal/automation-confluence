environments:
  uat:
    values:
      - ecrRegistry: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com
  prd:
    values:
      - ecrRegistry: 654654228951.dkr.ecr.ap-southeast-1.amazonaws.com
---
bases:
  - ../../global.yaml
  - ../app.yaml

releases:
  - name: fluentbit
    installed: true
    namespace: fluentbit
    chart: ecr-uat-helm-charts/helm/fluent-bit
    version: 0.52.0
    hooks:
      - events: ["presync"]
        showlogs: true
        command: "kubectl"
        args:
          - "apply"
          - "-f"
          - "namespace.yaml"
          - "--context"
          - "{{.Environment.KubeContext}}"
      - events: ["postsync"]
        showlogs: true
        command: "kubectl"
        args:
          - "apply"
          - "-f"
          - "{{ .Environment.Name }}.ingress.yaml"
          - "--context"
          - "{{.Environment.KubeContext}}"
    values:
      - default.values.yaml
      - "{{ .Environment.Name }}.values.yaml"
