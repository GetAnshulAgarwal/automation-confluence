apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lrd-bietl-spc
  namespace: lrd-bietl
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "PRD-APP-RDS-ORACLE-BIDB"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: BIDB_USERNAME-alias        
          - path: password
            objectAlias: BIDB_PASSWORD-alias

      - objectName: "PRD-APP-RDS-ORACLE-BI_BIDB"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: BI_BIDB_USERNAME-alias        
          - path: password
            objectAlias: BI_BIDB_PASSWORD-alias

      - objectName: "PRD-APP-RDS-ORACLE-STAGINGDB"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: STAGINGDB_USERNAME-alias        
          - path: password
            objectAlias: STAGINGDB_PASSWORD-alias

      - objectName: "PRD-APP-RDS-ORACLE-STAGINGDB1"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: STAGINGDB1_USERNAME-alias        
          - path: password
            objectAlias: STAGINGDB1_PASSWORD-alias

      - objectName: "PRD-APP-RDS-ORACLE-BI_OPERATIONALDB"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: BI_OPERATIONALDB_USERNAME-alias        
          - path: password
            objectAlias: BI_OPERATIONALDB_PASSWORD-alias
  secretObjects:
    - data:
        - key: BIDB_USERNAME
          objectName: BIDB_USERNAME-alias
        - key: BIDB_PASSWORD
          objectName: BIDB_PASSWORD-alias

        - key: BI_BIDB_USERNAME
          objectName: BI_BIDB_USERNAME-alias
        - key: BI_BIDB_PASSWORD
          objectName: BI_BIDB_PASSWORD-alias

        - key: STAGINGDB_USERNAME
          objectName: STAGINGDB_USERNAME-alias
        - key: STAGINGDB_PASSWORD
          objectName: STAGINGDB_PASSWORD-alias

        - key: STAGINGDB1_USERNAME
          objectName: STAGINGDB1_USERNAME-alias
        - key: STAGINGDB1_PASSWORD
          objectName: STAGINGDB1_PASSWORD-alias

        - key: BI_OPERATIONALDB_USERNAME
          objectName: BI_OPERATIONALDB_USERNAME-alias
        - key: BI_OPERATIONALDB_PASSWORD
          objectName: BI_OPERATIONALDB_PASSWORD-alias
      secretName: aws-secrets-manager-secret
      type: Opaque
