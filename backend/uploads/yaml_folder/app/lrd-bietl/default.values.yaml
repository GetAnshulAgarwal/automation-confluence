replicaCount: 1 #temp, to be updated to 2 after testing

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/lrd-bietl
  tag: 1.5.9
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: "/healthz"
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 120
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/readyz"
    port: 8080
    scheme: HTTP
  initialDelaySeconds: 120
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3