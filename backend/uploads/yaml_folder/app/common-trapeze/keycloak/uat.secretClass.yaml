apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keycloak-cert-spc
  namespace: keycloak
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    objects: |
      - objectName: "UAT-KEYCLOAK-CLIENT-PEM"
        objectType: "secretsmanager"
        objectAlias: "ad_ca.pem"
  secretObjects:
    - secretName: keycloak-cert
      type: Opaque
      data:
        - objectName: "ad_ca.pem"
          key: ad_ca.pem
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: keycloak-password-spc
  namespace: keycloak
spec:
  provider: aws
  parameters:
    region: ap-southeast-1
    objects: |
      - objectName: "UAT-KEYCLOAK-RDS-USER"
        objectType: "secretsmanager"
        jmesPath:
          - path: password
            objectAlias: password-alias
  secretObjects:
    - secretName: keycloak-password
      type: Opaque
      data:
        - objectName: "password-alias"
          key: password