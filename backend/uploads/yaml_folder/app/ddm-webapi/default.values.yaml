replicaCount: 2

image:
  repository: ddm-webapi
  tag: 1.0.18
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 150Mi

livenessProbe:
  httpGet:
    path: "/healthz/"
    port: 8082
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 60
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/readyz/"
    port: 8082
    scheme: HTTP
  initialDelaySeconds: 40
  timeoutSeconds: 5
  periodSeconds: 40
  successThreshold: 1
  failureThreshold: 3