apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: geoserver-spc # keep -spc suffix
  namespace: geoserver
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "PRD-GEOSERVER-DB"
        objectType: "secretsmanager"
        jmesPath:
          - path: GEOSERVER_PASSWORD
            objectAlias: GEOSERVER_PASSWORD-alias
  secretObjects: # using secret objects require syncSecret.enabled=true else you will get configuration error during deployement
    - data:
        - key: GEOSERVER_PASSWORD # key whose corresponding value will have content of the secret
          objectName: GEOSERVER_PASSWORD-alias # name of the mounted content to sync. this could be the object name or the object alias
      secretName: aws-secrets-manager-secret # DO NOT CHANGE THIS
      type: Opaque
