replicaCount: 1
 
image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/geoserver
  tag: 1.9.0
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8080
 
resources:
  limits:
    cpu: 512m
    memory: 2Gi
  requests:
    cpu: 128m
    memory: 1Gi
 
livenessProbe:
  httpGet:
    path: geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

extraVolumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "geoserver-spc"
extraVolumeMounts:
  - name: secrets-store-inline
    mountPath: "/mnt/secrets-store"
    readOnly: true
    
nodeSelector:
  karpenter.sh/nodepool: application-node-pool