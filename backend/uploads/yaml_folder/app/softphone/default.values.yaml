replicaCount: 1

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/softphone
  tag: 2.3.0
  pullPolicy: Always
service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 512m
    memory: 2Gi
  requests:
    cpu: 128m
    memory: 1Gi

livenessProbe: null

readinessProbe: null

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

nodeSelector:
  karpenter.sh/nodepool: application-node-pool