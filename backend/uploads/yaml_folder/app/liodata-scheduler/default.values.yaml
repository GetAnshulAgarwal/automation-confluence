replicaCount: 1

image:
  repository: liodata-scheduler
  tag: 1.0.22
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8101


resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 150Mi

livenessProbe:
  httpGet:
    path: "/healthcheck/liveness/"
    port: 8101
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 60
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/healthcheck/readiness/"
    port: 8101
    scheme: HTTP
  initialDelaySeconds: 40
  timeoutSeconds: 25
  periodSeconds: 120
  successThreshold: 1
  failureThreshold: 3