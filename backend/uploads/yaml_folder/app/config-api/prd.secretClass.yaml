apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: config-api-spc # keep -spc suffix
  namespace: config-api
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "PRD-KEYCLOAK-CLIENT-CONFIGURATIONSERVICE"
        objectType: "secretsmanager"
        jmesPath:
          - path: client_secret
            objectAlias: client_secret-alias
      - objectName: "PRD-APP-RDS-PGSQL-CONFIG_API_USER"
        objectType: "secretsmanager"
        jmesPath:
          - path: password
            objectAlias: password-alias
  secretObjects: # using secret objects require syncSecret.enabled=true else you will get configuration error during deployement
    - data:
        - key: client_secret # key whose corresponding value will have content of the secret
          objectName: client_secret-alias # name of the mounted content to sync. this could be the object name or the object alias
        - key: password # key whose corresponding value will have content of the secret
          objectName: password-alias # name of the mounted content to sync. this could be the object name or the object alias
      secretName: aws-secrets-manager-secret # DO NOT CHANGE THIS
      type: Opaque
