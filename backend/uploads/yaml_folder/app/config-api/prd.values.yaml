image:
  repository: 654654228951.dkr.ecr.ap-southeast-1.amazonaws.com/config-api

replicaCount: 3

extraEnvs:
  - name: ASPNETCORE_ENVIRONMENT
    value: Production
    # value: Development # temp one to create DB
  - name: CONFIG_API_PASSWORD
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: password
  - name: DATABASE__CONNECTIONSTRING
    value: "Host=prd-app-pgsql-pgsqldb.cluster-cha4uqgeogfu.ap-southeast-1.rds.amazonaws.com; Port=5482; Database=config_api; User ID=config_api_user; Password=$(CONFIG_API_PASSWORD); Pooling=true;"
  - name: IDENTITYPROVIDER
    value: Keycloak
  - name: KEYCLOAK__AUTHORITYURL
    value: https://keycloak.fms.itfs.lta.gov.sg
  - name: KEYCLOAK__REALM
    value: LIO
  - name: IDENTITYSERVER__AUTHORITYURL
    value: http://host.docker.internal:59419
  - name: KEYCLOAK__CONFIGURATIONSERVICE
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: client_secret
  - name: EXPLICITENVNAME
    value: lta_prod_cloud
  - name: TZ
    value: "Asia/Singapore"
  - name: Messaging__Nats__Url
    value: nats://nats.fms.itfs.lta.gov.sg:4222
  - name: Messaging__Nats__TopicPrefix
    value: lio.env0

ingress:
  enabled: true
  className: alb-internal-app
  hosts:
    - host: config-api.fms.itfs.lta.gov.sg
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - config-api.fms.itfs.lta.gov.sg
      secretName: config-api-tls
  annotations:
    kubernetes.io/tls-acme: "false"
    certmanager.k8s.io/cluster-issuer: acm-aws
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/success-codes: "200,302"
    alb.ingress.kubernetes.io/load-balancer-name: prd-app-intra-eks-app-alb-eks
    alb.ingress.kubernetes.io/group.name: alb-internal-app
    alb.ingress.kubernetes.io/security-groups: sg-08b5165e42765ab7d # PRD-APP-INTRA-EKS-APP-SG-ALB-EKS
    alb.ingress.kubernetes.io/healthcheck-path: "/health/readiness"
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:654654228951:regional/webacl/PRD-APP-INTRA-EKS-APP-WAF/2d40298d-b31c-4edf-b5ee-b6c9c928a17e
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
    
serviceAccount:
  create: true
  name: config-api-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::654654228951:role/PRD-IAMR-EKS-APP-POD-IDENTITY-API