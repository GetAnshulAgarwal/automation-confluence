apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: psgexchange-spc # keep -spc suffix
  namespace: psgexchange
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "AmazonMSK_UAT-SECRET-KAFKA-REALTIMEAPP"
        objectType: "secretsmanager"
        jmesPath:
          - path: password
            objectAlias: KAFKA_PASSWORD-alias
      - objectName: "UAT-APP-KEYSPACE"
        objectType: "secretsmanager"
        jmesPath:
          - path: CASSANDRA_PASSWORD
            objectAlias: CASSANDRA_PASSWORD-alias
      - objectName: "UAT-APP-EKS-WEATHER"
        objectType: "secretsmanager"
        jmesPath:
          - path: WEATHER_API_KEY
            objectAlias: WEATHER_API_KEY-alias
  secretObjects: # using secret objects require syncSecret.enabled=true else you will get configuration error during deployement
    - data:
        - key: KAFKA_PASSWORD # key whose corresponding value will have content of the secret
          objectName: KAFKA_PASSWORD-alias # name of the mounted content to sync. this could be the object name or the object alias
        - key: CASSANDRA_PASSWORD # key whose corresponding value will have content of the secret
          objectName: CASSANDRA_PASSWORD-alias # name of the mounted content to sync. this could be the object name or the object alias
        - key: WEATHER_API_KEY # key whose corresponding value will have content of the secret
          objectName: WEATHER_API_KEY-alias # name of the mounted content to sync. this could be the object name or the object alias
      secretName: aws-secrets-manager-secret # DO NOT CHANGE THIS
      type: Opaque