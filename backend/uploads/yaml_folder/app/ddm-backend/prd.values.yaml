image:
  repository:  654654228951.dkr.ecr.ap-southeast-1.amazonaws.com/ddm-backend

extraEnvs:
  - name: PROPERTY_JDBC_HOST
    value: "prd-app-oracle-oracledb.cha4uqgeogfu.ap-southeast-1.rds.amazonaws.com"
  - name: PROPERTY_JDBC_URL
    value: "jdbc:oracle:thin:@$(PROPERTY_JDBC_HOST):1581/DDM"
  - name: PROPERTY_JDBC_USERNAME
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: username
  - name: PROPERTY_JDBC_PASSWORD
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: password
  - name: PROPERTY_BACKEND_WAIT_INTERVAL
    value: "5"
  - name: PROPERTY_GARAGE_ID
    value: "1001"
  - name: PROPERTY_BACKEND_HTTP_PORT
    value: "8181"
  - name: PROPERTY_DOWNLOAD_OLD_ROOT
    value: "/ddm/storage/downloaddata"
  - name: PROPERTY_DOWNLOAD_NEW_ROOT
    value: "/ddm/download"
  - name: PROPERTY_UPLOAD_NEW_ROOT
    value: "/ddm/upload"
  - name: PROPERTY_UPLOAD_ONDEMAND_ROOT
    value: "/ddm/upload"
  - name: PROPERTY_DOWNLOAD_DEVICE_ROOT
    value: "download/<devicetype>/"
  - name: PROPERTY_ONDEMAND_ENABLE
    value: "0"
  - name: PROPERTY_COMMAND_MESSAGE_ENABLE
    value: "0"
  - name: PROPERTY_COMMAND_MESSAGE_BATCH_ENABLE
    value: "1"
  - name: PROPERTY_BATCH_SIZE
    value: "10"
  - name: PROPERTY_DOWNLOAD_BANDWIDTH_AVERAGE
    value: "400"
  - name: PROPERTY_LOAD_JOB_ENABLE
    value: "1"
  - name: LOG_APPENDER
    value: "ConsoleAppender"
  - name: PROPERTY_LOAD_JOB_INTERVAL
    value: "1"
  - name: TZ
    value: "Asia/Singapore"
  - name: PROPERTY_OTLP_COLLECTOR_URL
    value: "http://opentelemetry-collector.opentelemetry.svc.cluster.local:4318"
  - name: PROPERTY_OTLP_BACKEND_SERVICE_NAME
    value: "DDM_BACKEND_SERVICE"
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: PROPERTY_DDM_STORAGE_PATH
    value: "/ddm/storage"
  - name: NATS_SERVER
    value: "nats.fms.itfs.lta.gov.sg"
  - name: NATS_SUBJECT_ALERTS
    value: "DDM.Alerts.Alert"
  - name: ENVIRONMENT
    value: "prod"
  - name: DDM_MEMORY_THRESHOLD_MB
    value: "500" 
  - name: PROPERTY_S3_MOUNT_PATH
    value: "/ddm-backup/" 

serviceAccount:
  create: true
  name: ddm-backend-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::654654228951:role/PRD-IAMR-EKS-APP-POD-IDENTITY-DDM

extraDeploy:
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: leader-election-role
      namespace: ddm-backend
    rules:
      - apiGroups: ["coordination.k8s.io"]
        resources: ["leases"]
        verbs: ["get","list","watch","create","update","patch"]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: leader-election-binding
      namespace: ddm-backend
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: leader-election-role
    subjects:
      - kind: ServiceAccount
        name: ddm-backend-sa
        namespace: ddm-backend
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ddm-backend-ddm-fsx-pvc
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 50Gi
      storageClassName: ""
      volumeName: ddm-backend-ddm-fsx-pv
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: ddm-backend-ddm-s3-pvc
    spec:
      accessModes:
        - ReadWriteMany
      resources:
        requests:
          storage: 50Gi
      storageClassName: ""
      volumeName: ddm-backend-ddm-s3-pv

extraVolumes:
  - name: fsx-data
    persistentVolumeClaim:
      claimName: ddm-backend-ddm-fsx-pvc
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "ddm-backend-spc"
  - name: s3-data
    persistentVolumeClaim:
      claimName: ddm-backend-ddm-s3-pvc

extraVolumeMounts:
  - name: fsx-data
    mountPath: "/ddm"
  - name: secrets-store-inline
    mountPath: "/mnt/secrets-store"
    readOnly: true
  - name: s3-data
    mountPath: "/ddm-backup"

ingress:
  enabled: true
  className: alb-internal-app
  annotations:
    kubernetes.io/tls-acme: "false"
    certmanager.k8s.io/cluster-issuer: acm-aws
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/success-codes: "200,302"
    alb.ingress.kubernetes.io/load-balancer-name: prd-app-intra-eks-app-alb-eks
    alb.ingress.kubernetes.io/group.name: alb-internal-app
    alb.ingress.kubernetes.io/security-groups: sg-08b5165e42765ab7d
    alb.ingress.kubernetes.io/healthcheck-path: "/healthz"
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:654654228951:regional/webacl/PRD-APP-INTRA-EKS-APP-WAF/2d40298d-b31c-4edf-b5ee-b6c9c928a17e
  hosts:
    - host: ddm-backend.fms.itfs.lta.gov.sg
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - ddm-backend.fms.itfs.lta.gov.sg
      secretName: ddm-backend-tls

resources:
  limits:
    cpu: 512m
    memory: 2Gi
  requests:
    cpu: 128m
    memory: 1Gi