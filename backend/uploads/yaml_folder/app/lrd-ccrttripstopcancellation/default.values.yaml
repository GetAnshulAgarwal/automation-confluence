replicaCount: 2

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/lrd-ccrttripstopcancellation
  tag: 1.3.4
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 512m
    memory: 2Gi
  requests:
    cpu: 128m
    memory: 1Gi

livenessProbe:
  httpGet:
    path: "/live"
    port: 8080
    host: localhost
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/readyz"
    port: 8080
    host: localhost
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3

