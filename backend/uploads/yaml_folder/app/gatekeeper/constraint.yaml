apiVersion: constraints.gatekeeper.sh/v1beta1
kind: notationvalidation
metadata:
  name: ratify-constraint
  namespace: gatekeeper
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod", "Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper