replicaCount: 2

image:
  repository: lrd-fsxtos3
  tag: 1.4.4
  pullPolicy: IfNotPresent
  
service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 512m
    memory: 512Mi
  requests:
    cpu: 128m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: "/live"
    port: 8080
    host: localhost
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/readyz"
    port: 8080
    host: localhost
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3