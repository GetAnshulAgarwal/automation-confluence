replicaCount: 1

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/schedule
  tag: 2.19.7
  pullPolicy: Always
service:
  type: ClusterIP
  port: 6032

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

resources:
  limits:
    cpu: 3036m
    memory: 6Gi
  requests:
    cpu: 3036m
    memory: 6Gi

livenessProbe:
  httpGet:
    path: "/health/liveness"
    port: 6032
    scheme: HTTP
  initialDelaySeconds: 240
  timeoutSeconds: 10
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/health/readiness"
    port: 6032
    scheme: HTTP
  initialDelaySeconds: 240
  timeoutSeconds: 10
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3

