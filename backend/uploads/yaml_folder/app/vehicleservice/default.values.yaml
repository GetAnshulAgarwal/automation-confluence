replicaCount: 1

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/vehicleservice
  tag: 1.68.11
  pullPolicy: Always
service:
  type: ClusterIP
  port: 6033

resources:
  limits:
    cpu: 512m
    memory: 1Gi
  requests:
    cpu: 128m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: "/health/liveness"
    port: 6033
    scheme: HTTP
  initialDelaySeconds: 180
  timeoutSeconds: 5
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/health/readiness"
    port: 6033
    scheme: HTTP
  initialDelaySeconds: 180
  timeoutSeconds: 10
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3

extraVolumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "vehicleservice-spc"
extraVolumeMounts:
  - name: secrets-store-inline
    mountPath: "/mnt/secrets-store"
    readOnly: true

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

