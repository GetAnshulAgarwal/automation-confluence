apiVersion: config.ratify.deislabs.io/v1beta1
kind: Verifier
metadata:
  name: verifier-notation
  namespace: gatekeeper
spec:
  name: notation
  artifactTypes: application/vnd.cncf.notary.signature
  parameters:
    verificationCertStores:
      signingAuthority:
        certs:
          - aws-signer-root
    trustPolicyDoc:
      version: "1.0"
      trustPolicies:
        - name: aws-signer-trust
          registryScopes:
            - "*"
          signatureVerification:
            level: strict
            # CORRECT: Use the override block to skip revocation
            override:
              revocation: skip
          trustStores:
            - signingAuthority:certs
          trustedIdentities:
            - "arn:aws:signer:ap-southeast-1:483450377548:/signing-profiles/Trapeze_ITS_1"