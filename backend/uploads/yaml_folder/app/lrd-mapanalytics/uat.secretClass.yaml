apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lrd-mapanalytics-spc # keep -spc suffix
  namespace: lrd-mapanalytics
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "UAT-APP-EKS-LRD-DB"
        objectType: "secretsmanager"
        jmesPath:
          - path: LRD_PASSWORD
            objectAlias: LRD_PASSWORD-alias
      - objectName: "UAT-APP-EKS-MTV"
        objectType: "secretsmanager"
        jmesPath:
          - path: KEYCLOAK_CLIENT_SECRET
            objectAlias: KEYCLOAK_CLIENT_SECRET-alias
  secretObjects: # using secret objects require syncSecret.enabled=true else you will get configuration error during deployement
    - data:
        - key: LRD_PASSWORD # key whose corresponding value will have content of the secret
          objectName: LRD_PASSWORD-alias # name of the mounted content to sync. this could be the object name or the object alias
        - key: KEYCLOAK_CLIENT_SECRET # key whose corresponding value will have content of the secret
          objectName: KEYCLOAK_CLIENT_SECRET-alias # name of the mounted content to sync. this could be the object name or the object alias
      secretName: aws-secrets-manager-secret # DO NOT CHANGE THIS
      type: Opaque