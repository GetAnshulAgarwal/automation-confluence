apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: kps
  name: cert-manager-service-monitor
  namespace: observability
spec:
  endpoints:
  - port: tcp-prometheus-servicemonitor
  jobLabel: app.kubernetes.io/instance
  namespaceSelector:
    matchNames:
    - cert-manager
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
