  - name: ME_TCCASTREAMNAME
    value: "TccaOperator"
  - name: ME_TCCAEXPORTFORMAT
    value: "xls"
  - name: ME_TCCATEMPFILELOCATION
    value: "/san/MainETL/TempTCCALocation"
  - name: ME_TCCAOPERATOREXPORTPATH_1
    value: "STAGED_LOC=/san/LTATCCAExport/SMRT,IMPUTED_LOC=/san/LTATCCAExport/SMRT,SHORT_NAME=SMRT,FILTER=OPERATOR_SHORT_NAME,FILTER_TYPE=VARCHAR"
  - name: ME_TCCAOPERATOREXPORTPATH_2
    value: "STAGED_LOC=/san/LTATCCAExport/SBST,IMPUTED_LOC=/san/LTATCCAExport/SBST,SHORT_NAME=SBST,FILTER=OPERATOR_SHORT_NAME,FILTER_TYPE=VARCHAR"
  - name: ME_TCCAOPERATOREXPORTPATH_3
