replicaCount: 1

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/busdispatchservice
  tag: 1.7.14
  pullPolicy: Always
service:
  type: ClusterIP
  port: 6034

resources:
  limits:
    cpu: 512m
    memory: 2Gi
  requests:
    cpu: 128m
    memory: 1Gi
    
livenessProbe:
  httpGet:
    path: "/health/liveness"
    port: 6034
    scheme: HTTP
  initialDelaySeconds: 240
  timeoutSeconds: 10
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: "/health/readiness"
    port: 6034
    scheme: HTTP
  initialDelaySeconds: 240
  timeoutSeconds: 10
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3