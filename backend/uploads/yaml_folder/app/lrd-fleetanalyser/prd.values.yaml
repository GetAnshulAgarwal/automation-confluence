image:
  repository:  654654228951.dkr.ecr.ap-southeast-1.amazonaws.com/lrd-fleetanalyser

extraEnvs:
  - name: DB_SID
    value: "LRD"
  - name: DB_DATABASEMACHINEIP
    value: "prd-app-oracle-oracledb.cha4uqgeogfu.ap-southeast-1.rds.amazonaws.com"
  - name: DB_BIDB_USER
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BIDB_USERNAME
  - name: DB_BIDB_PWD
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BIDB_PASSWORD
  - name: DB_BIDB_USER_APP
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_BIDB_USERNAME
  - name: DB_BIDB_APP_PWD
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_BIDB_PASSWORD
  - name: DB_DSDB_USER_APP
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_DSDB_USERNAME
  - name: DB_DSDB_APP_PWD
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_DSDB_PASSWORD
  - name: DB_DSLIODB_USER_APP
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_DSLIODB_USERNAME
  - name: DB_DSLIODB_APP_PWD
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_DSLIODB_PASSWORD
  - name: DB_OPERATIONAL_USER_APP
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_OPERATIONALDB_USERNAME
  - name: DB_OPERATIONALDB_APP_PWD
    valueFrom:
      secretKeyRef:
        name: aws-secrets-manager-secret
        key: BI_OPERATIONALDB_PASSWORD
  - name: DB_PORT
    value: "1581"
  - name: DB_CONNECTION_TIMEOUT
    value: "120"
  - name: DB_DRIVER_NAME
    value: "oracle.jdbc.driver.OracleDriver"
  - name: DB_MAX_ACTIVE_CONNECTIONS
    value: "40"
  - name: DB_MAX_IDLE_CONNECTIONS
    value: "0"
  - name: DB_MAX_WAIT_TIME
    value: "30000"
  - name: NATSSERVER
    value: "nats://nats.fms.itfs.lta.gov.sg:4222"
  - name: FASTREAMNAME
    value: "FleetAnalyser"
  - name: FATECHVEHNOSUBJECT
    value: "TechnicalVehicleNumber"
  - name: TZ
    value: "Asia/Singapore"
  - name: "THREAD_STALL_THRESHOLD_SECS"
    value: "600"
  - name: NATS_ALERT_SUBJECT
    value: "LRD.Alerts.Alert"
  - name: MEMORY_THRESHOLD_MB
    value: "300"
  - name: POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

ingress:
  enabled: true
  className: alb-internal-app
  annotations:
    kubernetes.io/tls-acme: "false"
    certmanager.k8s.io/cluster-issuer: acm-aws
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/load-balancer-name: prd-app-intra-eks-app-alb-eks
    alb.ingress.kubernetes.io/group.name: alb-internal-app
    alb.ingress.kubernetes.io/healthcheck-path: "/readyz"
    alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:ap-southeast-1:654654228951:regional/webacl/PRD-APP-INTRA-EKS-APP-WAF/2d40298d-b31c-4edf-b5ee-b6c9c928a17e
    nginx.ingress.kubernetes.io/server-snippet: |
      large_client_header_buffers 4 32k;
  hosts:
    - host: lrd-fleetanalyser.fms.itfs.lta.gov.sg
      paths:
        - path: /*
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - lrd-fleetanalyser.fms.itfs.lta.gov.sg
      secretName: lrd-fleetanalyser-tls

serviceAccount:
  create: true
  name: lrd-fleetanalyser-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::654654228951:role/PRD-IAMR-EKS-APP-POD-IDENTITY-LRD

extraVolumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "lrd-fleetanalyser-spc"
    
extraVolumeMounts:
  - name: secrets-store-inline
    mountPath: "/mnt/secrets-store"
    readOnly: true

keda:
  enabled: true
  secret: {}
  scaledObject:
    minReplicas: 2
    maxReplicas: 5
    pollingInterval: 5
    triggers:
      - type: nats-jetstream
        metadata:
          natsServerMonitoringEndpoint: "nats://nats.fms.itfs.lta.gov.sg:8222"
          account: "$G"
          stream: "FleetAnalyser"
          consumer: "fleet_analyser"
          lagThreshold: "10"