# KEDA air-gapped image overrides

imagePullSecrets:
  - name: my-ecr-secret  # remove if not required

resources:
  operator:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  webhooks:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

webhooks:
  enabled: true

logging:
  operator:
    level: info
  metricServer:
    level: 0
    zapLevel: info

certificates:
  autoGenerated: true
  secretName: kedaorg-certs
