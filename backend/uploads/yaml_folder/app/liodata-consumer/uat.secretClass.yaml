apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: liodata-consumer-spc # keep -spc suffix
  namespace: liodata-consumer
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "UAT-APP-EKS-LIODATA-DB"
        objectType: "secretsmanager"
        jmesPath:
          - path: LIODATA_PASSWORD
            objectAlias: LIODATA_PASSWORD-alias
  secretObjects: # using secret objects require syncSecret.enabled=true else you will get configuration error during deployement
    - data:
        - key: LIODATA_PASSWORD # key whose corresponding value will have content of the secret
          objectName: LIODATA_PASSWORD-alias # name of the mounted content to sync. this could be the object name or the object alias
      secretName: aws-secrets-manager-secret # DO NOT CHANGE THIS
      type: Opaque