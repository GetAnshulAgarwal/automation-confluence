replicaCount: 1

image:
  repository: liodata-webapi
  tag: 1.0.26
  pullPolicy: Always
service:
  type: ClusterIP
  port: 8082
  targetPort: 8082

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 128m
    memory: 150Mi

livenessProbe: 
  httpGet:
    path: "/healthcheck/liveness/"
    port: 8082
    scheme: HTTP
  initialDelaySeconds: 60
  timeoutSeconds: 5
  periodSeconds: 60
  successThreshold: 1
  failureThreshold: 3

readinessProbe: 
  httpGet:
    path: "/healthcheck/readiness/"
    port: 8082
    scheme: HTTP
  initialDelaySeconds: 40
  timeoutSeconds: 5
  periodSeconds: 40
  successThreshold: 1
  failureThreshold: 3