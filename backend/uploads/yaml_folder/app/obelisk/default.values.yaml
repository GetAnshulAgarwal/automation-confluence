apiVersion: v1
kind: Namespace
metadata:
  name: obelisk

replicaCount: 1

image:
  repository: 381491900351.dkr.ecr.ap-southeast-1.amazonaws.com/obelisk
  tag: 1.12.0
  pullPolicy: Always

service:
  type: ClusterIP
  port: 9003

resources:
  limits:
    cpu: 512m
    memory: 2Gi
  requests:
    cpu: 128m
    memory: 1Gi
    
livenessProbe:
  exec:
    command:
      - sh
      - -c
      - "find /app/healthcheck.liveness -mmin -1"
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  exec:
    command:
      - sh
      - -c
      - "find /app/healthcheck.readiness -mmin -1"
  initialDelaySeconds: 10
  periodSeconds: 20

extraVolumes:
  - name: secrets-store-inline
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "obelisk-spc"
extraVolumeMounts:
  - name: secrets-store-inline
    mountPath: "/mnt/secrets-store"
    readOnly: true

nodeSelector:
  karpenter.sh/nodepool: application-node-pool